name: Data Quality Check

# Runs hourly — catches bad data within one shift cycle without over-polling.
# Also fires on any push that touches data or validation code.

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - 'week3/data/**'
      - 'week3/validation/**'
      - 'week3/backend/data.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run validation
        run: |
          cd week3
          python -m validation.check_data_quality .

      - name: Run tests
        if: always()
        run: |
          pip install pytest
          python -m pytest week3/validation/test_data_quality.py -v --tb=short

      - name: Block deploy on failure
        if: failure()
        run: |
          echo "Data quality check failed — deployment blocked."
          exit 1
